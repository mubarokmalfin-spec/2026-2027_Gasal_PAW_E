<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <h1>Register</h1>
    <form name="myForm" action="processData.php" method="POST">
        <fieldset>
            <legend>Person Details</legend>

            <div class="field">
                <label for="surname">Surname</label><br>
                <input type="text" name="surname" id="surname" size="31">
            </div>

            <div class="field">
                <label for="email">Email address</label><br>
                <input type="text" name="email" id="email" size="31">
            </div>

            <div class="field">
                <label for="password">Password</label><br>
                <input type="password" name="password" id="password" size="31">
            </div>

            <div class="field">
                <label for="address">Street Address</label><br>
                <textarea name="address" id="address" rows="3" cols="22"></textarea>
            </div>

            <div class="field">
                <label for="state">State</label><br>
                <select name="state" id="state">
                    <option value="">[choose your state]</option>
                    <option value="Australian Capital Territory">Australian Capital Territory</option>
                    <option value="Queensland">Queensland</option>
                    <option value="Victoria">Victoria</option>
                    <option value="New South Wales">New South Wales</option>
                    <option value="Tasmania">Tasmania</option>
                    <option value="South Australia">South Australia</option>
                    <option value="Western Australia">Western Australia</option>
                    <option value="Northern Territory">Northern Territory</option>
                </select>
            </div>

            <div class="field">
                <input type="hidden" name="country" value="Australia">
            </div>

            <div class="field">
                <label>Gender</label><br>
                <input type="radio" name="gender" id="male" value="Male">
                <label for="male">Male</label>
                <input type="radio" name="gender" id="female" value="Female">
                <label for="female">Female</label>
            </div>

            <div class="field">
                <label for="vegetarian">Vegetarian?</label><br>
                <input type="checkbox" name="vegetarian" id="vegetarian" value="Yes">
            </div>

            <div class="field">
                <br>
                <input type="submit" value="Submit" name="submit">
                <input type="reset" value="Reset" name="reset">
            </div>
        </fieldset>
    </form>
</body>
</html>
